let AUDIO_OK=false;
const FEMALE_FR=/audrey|am[eé]lie|amelia|marie|julie|c[eé]line|chantal|virginie|flo|aurelie|google/i;
const MALE_FR=/thomas|daniel|nicolas|guillaume|paul|henri/i;

function unlockAudio(){
  if(AUDIO_OK)return;AUDIO_OK=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      const ctx=new AC();
      if(ctx.resume)ctx.resume();
      const o=ctx.createOscillator(),g=ctx.createGain();
      g.gain.value=0.0001;o.connect(g);g.connect(ctx.destination);
      o.start();o.stop(ctx.currentTime+0.06);
    }
  }catch(e){}
  try{
    const a=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=");
    a.volume=0.01;a.play().catch(()=>{});
  }catch(e){}
}
window.addEventListener("pointerdown",unlockAudio,{once:true});

function frVoice(){
  if(!window.speechSynthesis)return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang||""));
  if(!vs.length)return null;
  const female=vs.find(v=>FEMALE_FR.test(v.name||""));
  if(female)return female;
  const notMale=vs.find(v=>!MALE_FR.test(v.name||""));
  return notMale||vs[0];
}
let CLIP=null, ACTX=null, ABUF={};
function actx(){
  try{
    if(!ACTX){const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; ACTX=new C();}
    if(ACTX.state==="suspended")ACTX.resume();
    return ACTX;
  }catch(e){return null;}
}
async function playClipWA(src,rate,onend){
  const c=actx();
  if(!c) return false;
  try{
    let b=ABUF[src];
    if(!b){
      const r=await fetch(src);
      const ab=await r.arrayBuffer();
      b=await c.decodeAudioData(ab);
      ABUF[src]=b;
    }
    const s=c.createBufferSource();
    s.buffer=b;
    s.playbackRate.value=rate||1;
    const g=c.createGain(); g.gain.value=1;
    s.connect(g); g.connect(c.destination);
    s.onended=()=>{ if(onend)onend(); };
    s.start();
    return true;
  }catch(e){ return false; }
}
function playClip(src,rate){
  try{
    if(CLIP){CLIP.pause();CLIP.currentTime=0}
    CLIP=new Audio(src);
    CLIP.volume=1;
    if(rate)CLIP.playbackRate=rate;
    CLIP.play().catch(()=>{ if(AUDIO_OK)speak("") });
  }catch(e){}
}
function speak(text,rate){
  try{
    if(!window.speechSynthesis)return;
    const go=()=>{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang="fr-FR";
      u.rate=rate||0.85;
      u.pitch=1.05;
      u.volume=1;
      const v=frVoice();
      if(v)u.voice=v;
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.getVoices().length===0){
      setTimeout(go,180);
    } else { go(); }
  }catch(e){}
}
if(window.speechSynthesis){
  speechSynthesis.onvoiceschanged=()=>{ speechSynthesis.getVoices(); };
  speechSynthesis.getVoices();
}

function frNum(n){
  const u=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const t=["","","vingt","trente","quarante","cinquante","soixante"];
  function b100(x){
    if(x<20)return u[x];
    const d=Math.floor(x/10),r=x%10;
    if(d===7)return "soixante"+(r===1?"-et-":"-")+u[10+r];
    if(d===9)return "quatre-vingt-"+u[10+r];
    if(d===8)return "quatre-vingt"+(r===0?"s":"-"+u[r]);
    if(r===0)return t[d];
    if(r===1)return t[d]+"-et-un";
    return t[d]+"-"+u[r];
  }
  function b1000(x){
    if(x<100)return b100(x);
    const c=Math.floor(x/100),r=x%100;
    const head=c===1?"cent":u[c]+" cent"+(r===0?"s":"");
    return head+(r?" "+b100(r):"");
  }
  if(n===0)return "zéro";
  const parts=[];
  const m=Math.floor(n/1e6),k=Math.floor((n%1e6)/1000),r=n%1000;
  if(m)parts.push(m===1?"un million":b1000(m)+" millions");
  if(k)parts.push(k===1?"mille":b1000(k)+" mille");
  if(r)parts.push(b1000(r));
  return parts.join(" ");
}
function placesPanel(numStr){
  const labels=["unités","dizaines","centaines","milliers","dizaines de milliers","centaines de milliers","millions","dizaines de millions"];
  const digits=String(numStr).split("");
  const cells=digits.map((d,i)=>{
    const rank=digits.length-1-i;
    const hi=(d!=="0")?" hi":"";
    return `<div class="place${hi}"><b>${d}</b><span>${labels[rank]||""}</span></div>`;
  }).join("");
  return `<div class="places">${cells}</div>
    <div style="text-align:center;margin-top:10px;font-weight:700;color:#9fe870">${frNum(parseInt(numStr,10))}</div>`;
}

   opts:shuffle([`${n-k}/${n}`,`${k}/${n}`,`${n-k}/${k}`,`${k+1}/${n}`]).slice(0,4)}}}
]
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let S=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY));return r&&r.ch?r:blank()}catch(e){return blank()}})();

 S.streak=S.last===y?S.streak+1:1;S.best=Math.max(S.best||0,S.streak);S.last=t;save()}
function chState(id){if(!S.ch[id])S.ch[id]={n:0,ok:0};return S.ch[id]}

/* ---------- quiz ---------- */
let Q=null;
function startQuiz(chId){
  const c=chapterById(chId);
  Q={c,i:0,n:8,ok:0,ko:0,cur:null,start:Date.now()};
  nextQ();go("quiz");
}
function nextQ(){
  const g=Q.c.gen();
  Q.cur=g;
  Q.spoken=false;
}
function quiz(a){
  if(!Q)return go("home");
  const bar=`<div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(100*Q.i/Q.n)}%"></i></div>`;
  const q=Q.cur;
  const opts=q.opts;
  a.innerHTML=`${bar}
    <div class="top" style="margin-bottom:8px">
      <button class="back" onclick="go('chapter')">‹</button>
      <span class="tiny muted">${Q.i+1} / ${Q.n} · ${esc(Q.c.t)}</span>
      <span class="tiny muted">${Q.ok} ✓</span>
    </div>
    <div class="cardq">
      ${q.speak
        ? `<div class="tiny muted" style="text-align:center;letter-spacing:.08em;text-transform:uppercase;font-weight:800">Dictée</div>
           <div class="biglisten">🔊</div>
           <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">
             <button class="pill" id="sp">🔊 Réécouter</button>
             <button class="pill" id="sl">🐢 Lent</button>
             <button class="pill" id="sv">🎚️ Tester la voix</button>
           </div>`
        : `<div class="bigq" style="white-space:pre-line">${esc(q.q)}</div>`}
      ${q.unit?`<div class="tiny muted" style="margin-top:6px">réponse en ${esc(q.unit)}</div>`:""}
    </div>
    ${opts?`<div id="o">${opts.map((x,i)=>`<button class="choice" data-v="${esc(x)}"><span class="k">${"ABCD"[i]}</span>${esc(x)}</button>`).join("")}</div>`
      :`<div class="entry">
          <input id="in" type="text" inputmode="${q.speak?"numeric":"decimal"}" enterkeyhint="done" placeholder="${q.speak?"le nombre entendu":"ta réponse"}" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="okbtn" id="ok2">Valider ✓</button>
        </div>
        ${q.speak?`<p class="tiny muted" style="text-align:center;margin-top:8px">écoute puis écris le nombre en chiffres</p>`:""}`}
    <div class="feed"><div><button class="btn" id="nx" ${opts?"disabled":""}>${opts?"Répondre":"Valider"}</button></div></div>`;
  let answered=false;
  const check=(val)=>{
    if(answered)return;answered=true;
    const ok=String(val).trim()===String(q.a)||(num(val)!==null&&num(q.a)!==null&&Math.abs(num(val)-num(q.a))<1e-9);
    if(ok){Q.ok++;S.good++;S.xp+=10;S.history[today()]=S.history[today()]||{xp:0,m:0};S.history[today()].xp=(S.history[today()].xp||0)+10}
    else{Q.ko++;S.bad++;S.xp+=2;toast("Réponse : "+q.a)}
    const st=chState(Q.c.id);st.n++;if(ok)st.ok=Math.min(9,st.ok+1);
    save();
    if(opts)a.querySelectorAll("#o .choice").forEach(b=>{if(b.dataset.v===String(q.a))b.classList.add("ok");else if(b.dataset.v===String(val))b.classList.add("no")});
    $("#nx").textContent=Q.i+1>=Q.n?"Terminer":"Suivant";
    $("#nx").disabled=false;
    const fb=document.createElement("div");
    fb.className="fb "+(ok?"ok":"no");
    const panel=q.places?placesPanel(q.a):"";
    const rep=esc(q.a)+(q.unit?" "+q.unit:"");
    fb.innerHTML=ok?("✓ Juste — <b>"+rep+"</b>"+panel)
                   :((q.speak?"✗ Faux. Le nombre était <b>":"✗ Faux. La bonne réponse est <b>")+rep+"</b>"+panel);
    const fd=document.querySelector(".feed");
    if(fd)fd.parentElement.insertBefore(fb,fd);
  };
  const field=$("#in");
  const refocus=()=>{
    const f=$("#in"); if(!f)return;
    try{ f.focus({preventScroll:true}) }catch(e){ try{f.focus()}catch(_){} }
    try{ f.scrollIntoView({block:"center",behavior:"smooth"}) }catch(e){}
  };
  if(q.speak){
    const sp=$("#sp"), sl=$("#sl"), sv=$("#sv");
    [sp,sl,sv].forEach(b=>{ if(b) b.addEventListener("pointerdown",ev=>ev.preventDefault()); });
    const play=(r,slow)=>{
      unlockAudio(); refocus();
      const base=q.audio;
      const src=slow&&base?base.replace("audio/","audio/slow/"):base;
      if(base){
        playClipWA(src,slow?1:(r||1),()=>setTimeout(refocus,50)).then(ok=>{
          if(!ok && slow){
            playClipWA(base,0.75,()=>setTimeout(refocus,50));
            return;
          }
          if(!ok){ playClip(base,r||1); if(CLIP)CLIP.onended=()=>setTimeout(refocus,60); }
          setTimeout(refocus,150);
        });
      } else {
        speak(q.speak,slow?0.62:(r||.85));
        setTimeout(refocus,900);
      }
    };
    if(sp)sp.onclick=()=>play(1);
    if(sl)sl.onclick=()=>play(1,true);
    if(sv)sv.onclick=()=>{unlockAudio(); if(NUMDICT.length)playClip("audio/"+NUMDICT[0].f); setTimeout(refocus,150)};
    if(!Q.spoken){
      Q.spoken=true;
      setTimeout(()=>{ if(q.audio){playClip(q.audio); if(CLIP)CLIP.onended=()=>setTimeout(refocus,60);} else if(AUDIO_OK)speak(q.speak,.85); },400);
    }
    setTimeout(refocus,150);
    setTimeout(refocus,1400);
  }
  if(opts){
    a.querySelectorAll("#o .choice").forEach(b=>b.onclick=()=>check(b.dataset.v));
  }else{
    const inp=$("#in");
    if(inp){
      inp.onkeydown=e=>{if(e.key==="Enter")$("#nx").click()};
      setTimeout(refocus,200);
    }
    const submit=()=>{
      if(!answered){const v=inp?inp.value:"";if(!v.trim()){toast("Écris le nombre");return}check(v)}
      else{advance()}
    };
    $("#nx").onclick=submit;
    const ok2=$("#ok2");
    if(ok2){ ok2.addEventListener("pointerdown",ev=>ev.preventDefault()); ok2.onclick=submit; }
  }
  if(opts)$("#nx").onclick=()=>{if(!answered){const sel=a.querySelector("#o .choice.sel");if(!sel)return toast("Choisis une réponse");check(sel.dataset.v)}else{advance()}};
  a.querySelectorAll("#o .choice").forEach(b=>b.addEventListener("click",()=>{
    a.querySelectorAll("#o .choice").forEach(x=>x.style.borderColor="");
  },{once:false}));
  function advance(){
    Q.i++;
    if(Q.i>=Q.n)return endQuiz();
    nextQ();render();
  }
  Q._advance=advance;
}
function endQuiz(){

  $("#imp").onclick=()=>$("#fi").click();
  $("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{S=mergeState(S,JSON.parse(r.result));save();toast("Importé ✓");render()}catch(x){toast("Fichier invalide")}};r.readAsText(f)};
  $("#rst").onclick=()=>{if(confirm("Effacer toute la progression ?")){localStorage.removeItem(KEY);S=blank();location.reload()}};
}

function mergeState(a,b){
  const o=JSON.parse(JSON.stringify(a));b=b||{};
  ["xp","streak","best","minutes","good","bad"].forEach(k=>o[k]=Math.max(a[k]||0,b[k]||0));
  o.last=[a.last||"",b.last||""].sort().pop();
  o.ch=Object.assign({},b.ch||{});
  Object.keys(a.ch||{}).forEach(k=>{const v=a.ch[k],w=o.ch[k];
    o.ch[k]=w?{n:Math.max(v.n||0,w.n||0),ok:Math.max(v.ok||0,w.ok||0)}:v});
  o.history=Object.assign({},b.history||{});
  Object.keys(a.history||{}).forEach(k=>{const v=a.history[k]||{},w=o.history[k]||{};
    o.history[k]={xp:Math.max(v.xp||0,w.xp||0),m:Math.max(v.m||0,w.m||0)}});
  o.profile=a.profile||b.profile;o.gistId=a.gistId||b.gistId;
  return o;
}
async function ghSync(){
  const t=tok();if(!t)return toast("Ajoute un token GitHub");
  const base="https://api.github.com";
  const h={Authorization:"***"+t,Accept:"application/vnd.github+json","Content-Type":"application/json"};
  try{
    if(S.gistId){
      const r=await fetch(base+"/gists/"+S.gistId,{headers:h});
      if(r.ok){const g=await r.json();const f=g.files&&g.files["maths-progress.json"];
        if(f&&f.content){try{S=mergeState(S,JSON.parse(f.content))}catch(e){}}}
    }
    const payload=JSON.stringify({description:"Maths — progression (privé)",public:false,
      files:{"maths-progress.json":{content:JSON.stringify(S)}}});
    const r2=S.gistId?await fetch(base+"/gists/"+S.gistId,{method:"PATCH",headers:h,body:payload})
                      :await fetch(base+"/gists",{method:"POST",headers:h,body:payload});
    if(!r2.ok)throw new Error("HTTP "+r2.status);
    const g2=await r2.json();S.gistId=g2.id;S.synced=Date.now();save();
    toast("Synchronisé ✓");render();
  }catch(e){toast("Échec : "+e.message)}
}

/* ---------- minute clock ---------- */
setInterval(()=>{if(!S.profile)return;const t=today();
  S.history[t]=S.history[t]||{xp:0,m:0};S.history[t].m=(S.history[t].m||0)+1/6;S.minutes+=1/6;save()},10000);

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
window.addEventListener("error",function(e){
  try{
    var d=document.getElementById("errbox")||document.createElement("div");
    d.id="errbox";
    d.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#7f1d1d;color:#fff;padding:12px;border-radius:14px;font:12px/1.4 monospace;white-space:pre-wrap";
    d.textContent="ERREUR APPLI\n"+(e.message||e.error||"inconnue")+"\n"+(e.filename||"")+":"+(e.lineno||"");
    document.body.appendChild(d);
  }catch(_){}
},true);
render();
</script>
